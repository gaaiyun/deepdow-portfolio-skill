name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel to avoid huge CUDA downloads; numpy + pandas are the
          # other runtime deps the tests need. matplotlib / yfinance / deepdow are
          # optional and intentionally skipped (tests gate on them via importorskip /
          # simulated-missing-import).
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            "numpy>=1.21" "pandas>=1.3" "torch>=1.10"
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v
